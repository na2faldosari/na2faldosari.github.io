<script>
/* قبل الرسم: الثيم واللغة من التخزين — الداكن والعربية هما الافتراض، كصفحة الرئيسية */
(function(){
  try{
    var t = localStorage.getItem("naif-portfolio-theme");
    if(t !== "light" && t !== "dark"){
      t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    if(t === "light") document.documentElement.classList.add("light");
    var l = localStorage.getItem("naif-portfolio-locale");
    if(l !== "ar" && l !== "en") l = "ar";
    if(l === "en"){ document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  }catch(e){}
})();
</script>

<style>
/* ---------- ترويسة الصفحة ---------- */
.topbar{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 80%,transparent);
  backdrop-filter:blur(8px)}
@supports not (backdrop-filter:blur(1px)){.topbar{background:color-mix(in srgb,var(--background) 95%,transparent)}}
.topbar .in{width:100%;max-width:52rem;margin-inline:auto;padding-inline:16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;
  height:32px;padding-inline:12px;border-radius:8px;transition:background .15s}
.back:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
/* سهم الرجوع يتبع اتجاه القراءة: في العربية يشير يميناً، وفي الإنجليزية يساراً.
   الأيقونة مرسومة تشير يميناً، فالقلب يلزم في LTR لا في RTL. */
html[dir=ltr] .back svg{transform:scaleX(-1)}
.tools{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;
  font-size:14px;font-weight:500;border:1px solid transparent;transition:background .15s,border-color .15s}
.btn-outline{border-color:var(--input);background:color-mix(in srgb,var(--input) 30%,transparent);height:36px;padding-inline:14px}
.light .btn-outline{border-color:var(--border);background:var(--background)}
.btn-icon{width:36px;padding:0}

/* ---------- المقالة ---------- */
.wrap{max-width:52rem;margin-inline:auto;padding:56px 16px 80px}
.eyebrow{font-size:14px;color:var(--muted-foreground)}
h1{font-size:34px;line-height:1.2;font-weight:700;margin-top:8px}
@media (min-width:640px){h1{font-size:44px}}
html[dir=ltr] h1{letter-spacing:-.025em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.meta span{font-size:13px;line-height:16px;color:var(--muted-foreground);
  border:1px solid var(--border);border-radius:9999px;padding:5px 12px}
.lede{font-size:18px;line-height:1.85;color:var(--muted-foreground);margin-top:24px}
h2{font-size:22px;font-weight:600;margin-top:48px}
h2+p,h2+ul{margin-top:12px}
p{line-height:1.85;color:var(--muted-foreground)}
.wrap ul{list-style:disc;padding-inline-start:18px;display:flex;flex-direction:column;gap:10px;
  line-height:1.85;color:var(--muted-foreground)}
.wrap ul b{color:var(--foreground);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px}
.links a{font-size:15px;color:var(--foreground);border-bottom:1px solid var(--border);
  padding-bottom:2px;transition:border-color .15s}
.links a:hover{border-bottom-color:var(--foreground)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{font-size:12px;line-height:16px;border-radius:6px;padding:4px 10px;
  background:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted-foreground);
  font-family:Geist,"Geist Fallback",ui-sans-serif,system-ui,sans-serif}

/* ---------- الشاشات في إطار متصفح ---------- */
.shots{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
@media (min-width:700px){.shots{grid-template-columns:1fr 1fr}}
.shot{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.shot .bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.shot .bar i{width:8px;height:8px;border-radius:50%;background:var(--muted-foreground);opacity:.4}
.shot img{width:100%;display:block;aspect-ratio:16/10;object-fit:contain;
  background:color-mix(in srgb,var(--muted) 55%,transparent)}
/* الصور شديدة العرض أو الطول تحتفظ بنسبتها بدل حشرها في الإطار */
.shot.free img{aspect-ratio:auto}
.shot figcaption{font-size:13px;line-height:16px;color:var(--muted-foreground);padding:10px 12px}

footer{border-top:1px solid var(--border);padding:32px 0}
footer .in{max-width:52rem;margin-inline:auto;padding-inline:16px;display:flex;flex-wrap:wrap;
  justify-content:space-between;gap:8px;font-size:14px;color:var(--muted-foreground)}
</style>

<script>
(function(){
  var THEME_KEY = "naif-portfolio-theme", LOCALE_KEY = "naif-portfolio-locale";
  var root = document.documentElement;

  var dict = {
    ar: {
      back:"كل المشاريع",
      langToggle:"English",
      eyebrow:"برنامج آبل التأسيسي للذكاء الاصطناعي · 2025",
      title:"تطبيق ملهم",
      m1:"تصميم الواجهة والتجربة وربط الواجهة البرمجية",
      m2:"فريق من أربعة",
      m3:"أكاديمية آبل للمطورين مع طويق",
      lede:"تطبيق آيفون يساعد من لديهم تشتّت الانتباه على تحويل الخاطر المتشابك إلى خطوة واحدة. بنيته خلال خمسة أسابيع ضمن الدفعة الأولى من برنامج آبل التأسيسي.",
      h_problem:"المشكلة",
      p_problem:"من لديه تشتّت الانتباه لا تنقصه الأفكار، بل تنقصه نقطة يبدأ منها. يتشابك الخاطر مع غيره حتى يصير كتلة واحدة يصعب تفكيكها، وتزيد أدوات المهام التقليدية الحمل لأنها تطلب ترتيبًا مسبقًا هو نفسه ما يعجز عنه.",
      h_solution:"الحل",
      p_solution:"مساحة تستقبل الخاطر كما هو، ثم تحوّله إلى خطوة صغيرة قابلة للتنفيذ. تحمل التطبيق ثلاث شاشات، ويصوغ نموذج لغوي الاقتراح بحسب حالة اللحظة لا وفق قالب ثابت.",
      h_features:"الشاشات الثلاث",
      f1:"<b>تتبّع الحالة.</b> قراءة سريعة للمزاج تُبنى عليها بقية التجربة.",
      f2:"<b>المرآة اللطيفة.</b> تعيد صياغة ما يدور في ذهن المستخدم بنبرة لا تحاكمه.",
      f3:"<b>خطوة صغيرة.</b> اقتراح واحد قابل للتنفيذ الآن، لا قائمة مهام جديدة.",
      f4:"<b>دوري في الفريق.</b> صمّمتُ واجهة الاستخدام وتجربتها، وربطتُ الواجهة البرمجية للنموذج اللغوي.",
      h_screens:"من البرنامج",
      s1:"الشاشات الثلاث التي يقوم عليها التطبيق",
      s2:"مسار الترحيب والتهيئة",
      s3:"الدفعة في أكاديمية آبل للمطورين",
      s4:"شهادة حضور البرنامج",
      h_stack:"التقنيات",
      h_links:"روابط",
      h_note:"ملاحظة",
      p_note:"اختِرتُ ضمن 66 متدرّبًا من أنحاء المملكة للدفعة الأولى من البرنامج. المستودع باسم زميلة في الفريق، ومساهماتي مسجّلة فيه.",
      copy:"© 2026 نايف الدوسري. جميع الحقوق محفوظة.",
      role:"مطوّر برمجيات"
    },
    en: {
      back:"All projects",
      langToggle:"العربية",
      eyebrow:"Apple AI Foundation Program · 2025",
      title:"Mulhem",
      m1:"UI/UX design and API integration",
      m2:"Team of four",
      m3:"Apple Developer Academy with Tuwaiq",
      lede:"An iOS app helping people with ADHD turn a tangled thought into a single next step. Built over five weeks in the first cohort of the Apple AI Foundation Program.",
      h_problem:"The problem",
      p_problem:"People with ADHD do not lack ideas — they lack a place to start. One thought tangles into the next until it becomes a single mass that is hard to pull apart, and conventional task apps add to the load because they demand exactly the upfront ordering the user cannot do.",
      h_solution:"The solution",
      p_solution:"A private space that takes the thought as it comes and hands back one small, doable step. Three screens carry the app, with a language model shaping the suggestion to the moment rather than to a fixed template.",
      h_features:"The three screens",
      f1:"<b>Mood progress.</b> A quick read of how the user is doing, which the rest of the experience builds on.",
      f2:"<b>Kind Mirror.</b> Reflects back what is on the user's mind in a tone that does not judge.",
      f3:"<b>Take a Step.</b> One suggestion that can be acted on now — not another to-do list.",
      f4:"<b>My part in the team.</b> I designed the UI and its experience, and integrated the language-model API.",
      h_screens:"From the program",
      s1:"The three screens the app is built on",
      s2:"The welcome and onboarding flow",
      s3:"The cohort at Apple Developer Academy",
      s4:"Certificate of attendance",
      h_stack:"Stack",
      h_links:"Links",
      h_note:"Note",
      p_note:"Selected as 1 of 66 nationwide for the program's first cohort. The repository sits under a teammate's account, and my contributions are recorded in it.",
      copy:"© 2026 Naif Aldosari. All rights reserved.",
      role:"Software Developer"
    }
  };

  function applyLocale(l){
    root.setAttribute("lang", l);
    root.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    var d = dict[l];
    var els = document.querySelectorAll("[data-i18n]");
    for(var i = 0; i < els.length; i++){
      var v = d[els[i].getAttribute("data-i18n")];
      if(v != null) els[i].innerHTML = v;
    }
    document.title = (l === "ar" ? d.title + " — نايف الدوسري" : d.title + " — Naif Aldosari");
  }

  function applyTheme(t){
    root.classList.toggle("light", t === "light");
    var btn = document.getElementById("theme");
    var icon = btn.querySelector("use");
    icon.setAttribute("href", t === "light" ? "#i-moon" : "#i-sun");
    btn.setAttribute("aria-label", root.getAttribute("lang") === "ar"
      ? (t === "light" ? "الوضع الداكن" : "الوضع الفاتح")
      : (t === "light" ? "Dark mode" : "Light mode"));
  }

  var locale = "ar", theme = "dark";
  try{
    var sl = localStorage.getItem(LOCALE_KEY); if(sl === "ar" || sl === "en") locale = sl;
    var st = localStorage.getItem(THEME_KEY);
    theme = (st === "light" || st === "dark") ? st
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  }catch(e){}
  applyLocale(locale); applyTheme(theme);

  document.getElementById("lang").addEventListener("click", function(){
    locale = locale === "ar" ? "en" : "ar";
    try{ localStorage.setItem(LOCALE_KEY, locale); }catch(e){}
    applyLocale(locale); applyTheme(theme);
  });
  document.getElementById("theme").addEventListener("click", function(){
    theme = theme === "light" ? "dark" : "light";
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    applyTheme(theme);
  });
  addEventListener("storage", function(e){
    if(e.key === LOCALE_KEY && (e.newValue === "ar" || e.newValue === "en")){ locale = e.newValue; applyLocale(locale); applyTheme(theme); }
    if(e.key === THEME_KEY && (e.newValue === "light" || e.newValue === "dark")){ theme = e.newValue; applyTheme(theme); }
  });
})();
</script>
